<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>ordered list</h2>
    <ol>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>
    <h2>unordered list</h2> 
    <ul>   
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li> 
    </ul>

    <h2>Nested lists</h2>
    <ul>
        <ol>
            <li>Morning
                <ul>
                    <li>Breakfast</li>
                    <li>yoga</li>
                    <li>gym</li>
                </ul>
            </li>

            <li>Afternoon
                <ul>
                    <li>Lunch</li>
                    <li>nap</li>
                    <li>work</li>
                </ul>
            </li>

            <li>Evening
                <ul>
                    <li>Dinner</li>
                    <li>walk</li>
                    <li>sleep</li>
                </ul>
            </li>
        </ol>
    </ul>
</body>
</html>
