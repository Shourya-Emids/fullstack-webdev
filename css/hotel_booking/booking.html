<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="brand">
            Hotel StayInn
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Booking</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="container">
        <h2>Book Your Stay</h2>

        <form action="" class="booking-form">
            <label>Name</label>
            <input type="text" id="" placeholder="Your Name" required>
            
            <label>Email</label>
            <input type="text" id="" placeholder="Your Email" required>
            
            <label>Room Type</label>
            <select name="" id="" required>
                <option value="deluxe">Deluxe Room</option>
                <option value="executive">Executive Room</option>
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="queen">Queen Room</option>
                <option value="king">King Room</option>
            </select>

            <label>Check-In Date</label>
            <input type="date" required>

            <label>Check-Out Date</label>
            <input type="date" required>

            <button type="submit">Book Now</button>
        </form>
    </main>

    <footer>
        &copy; Hotel StayInn. All rights reserved. 
    </footer>
</body>
</html>
